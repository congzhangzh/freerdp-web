name: pages

# This repository's GitHub Pages. The release kit (rdp-release-kit) builds the
# WebAssembly client with this page, tests it (a browser login to xrdp over
# SSH and websockify) and hands it over as its pre-release
# web-<YYYYMMDD>.<N>-<kit commit> (titled with the page commit), published once and never replaced (kit-release.sh
# finds it); this workflow builds nothing. A push or a pull request runs the page's own tests.
# Publishing happens only on purpose, a release tag (<YYYYMMDD>.<N>, no prefix; the
# older v<...> tags still work) or Run workflow with "publish":
# a tested client of the kit, this commit's page and the demo videos, checked
# with test-page.mjs, deployed, then a login from the published page. The
# client: the kit's newest tested client with this commit's page laid over it
# ("latest", for a release tag and by default by hand: a page release never waits for
# a kit run, as with site.sh), or, chosen by hand, the kit's build of this exact
# commit ("exact"). The Pages are this repository's own; the kit pins this
# repository's releases (tags with a GitHub Release), not the other way round.
on:
  push:
    branches: [main]
    # a release, <YYYYMMDD>.<N>; the older ones were v<...>
    tags: ['[0-9]*', 'v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this commit's page on GitHub Pages
        type: boolean
        default: false
      client:
        description: "The client: latest (the kit's newest tested one, fast; what a release tag uses) or exact (the kit's build of this commit)"
        type: choice
        options: [latest, exact]
        default: latest

permissions:
  contents: read

env:
  KIT: congzhangzh/rdp-release-kit

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests (vault, hosts, options, keyboard, the connection bridge)
        run: node --test web/tests/*.test.cjs
      - name: Which kit pre-release holds the client (kit-release.sh)
        run: ./test-kit-release.sh

  site:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [test]
    runs-on: ubuntu-24.04
    outputs:
      client: ${{ steps.client.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # the kit's newest tested client, this commit's page over it, the videos (site.sh)
      - name: The kit's newest tested client, with this commit's page
        if: ${{ inputs.client != 'exact' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: SITE=site ./site.sh kit

      # the kit's pre-release for this exact commit: its tested client, checked
      - name: The kit's build of this exact commit
        if: ${{ inputs.client == 'exact' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the kit's newest build of this commit: web-<YYYYMMDD>.<N>-<kit commit>, titled with it
          tag=$(./kit-release.sh "$GITHUB_SHA")
          base=https://github.com/$KIT/releases/download/$tag
          mkdir -p handoff site
          curl -fsSL -o handoff/freerdp-web-page.zip "$base/freerdp-web-page.zip"
          curl -fsSL -o handoff/freerdp-web-page.zip.sha256 "$base/freerdp-web-page.zip.sha256"
          (cd handoff && sha256sum -c freerdp-web-page.zip.sha256)
          unzip -q handoff/freerdp-web-page.zip -d site
          grep -q "page: freerdp-web $GITHUB_SHA" site/MANIFEST || { echo "the client was built for another page:" >&2; head -3 site/MANIFEST >&2; exit 1; }
          echo "$tag" > site/CLIENT
          ./fetch-media.sh site

      - name: Which client
        id: client
        run: |
          echo "tag=$(cat site/CLIENT)" >> "$GITHUB_OUTPUT"
          sed -n '1,2p;/^page from/p' site/MANIFEST

      # the files going live, with the client: hosts, vault, settings, splash (no server)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The page with the client
        run: node test-page.mjs site

      # .well-known/ holds the page's manifest (its version, the app's
      # identity); the action leaves out hidden directories unless asked
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Keep the test's screenshots and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-page
          path: out/
          if-no-files-found: ignore

  deploy:
    needs: [site]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}

  # Logs in from the published page, as a user would (granting Chrome's local
  # network permission), with the kit's login test and the kit's xrdp packages
  check:
    needs: [site, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: page

      - name: The kit's test, at the commit that built the client, and its xrdp packages
        env:
          tag: ${{ needs.site.outputs.client }}
        run: |
          base=https://github.com/$KIT/releases/download/$tag
          kit=$(curl -fsSL "$base/KIT_COMMIT")
          git clone -q "https://github.com/$KIT.git" kit
          git -C kit -c advice.detachedHead=false checkout -q "$kit"
          mkdir -p kit/dist/xrdp/debian-13
          for name in $(curl -fsSL "https://api.github.com/repos/$KIT/releases/tags/$tag" | python3 -c 'import json,sys; print(" ".join(a["name"] for a in json.load(sys.stdin)["assets"] if a["name"].endswith(".deb")))'); do
            curl -fsSL -o "kit/dist/xrdp/debian-13/$name" "$base/$name"
          done
          ls kit/dist/xrdp/debian-13

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # setup-uv publishes no vN alias any more: pinned by commit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # deploy-pages reports http://, the site redirects to https://
      - name: Wait until this commit's page is served
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          for i in $(seq 60); do
            curl -fsSL "${URL/#http:/https:}MANIFEST" 2> /dev/null | grep -q "$GITHUB_SHA" && exit 0
            sleep 10
          done
          echo "this commit's page did not appear at $URL" >&2; exit 1

      - name: Log in from the published page
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: PAGE_URL="${URL/#http:/https:}index.html" kit/test/wasm-session.sh - page/rdp-gateway.sh

      - name: Keep the logs and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-published
          path: kit/dist/test/
          if-no-files-found: ignore
